<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マッサージ師 予約確認画面（スマホ版）</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#F2F5EF; --surface:#FCFDFB; --surface-2:#E7ECE1; --border:#D3DBCB;
    --ink:#212821; --ink-soft:#5B6459; --ink-faint:#8A9284;
    --accent:#2E5D5A; --accent-strong:#1E4643; --accent-soft:#DCEAE6;
    --role-therapist:#3E6485; --role-therapist-soft:#DCE7EF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Shippori Mincho",serif;margin:0;}
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}
  .daytab{padding:8px 16px;border-radius:20px;font-size:13px;flex-shrink:0;}
  .booking-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .link-btn{font-size:12px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;}

</style>
</head>
<body>

<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);background:var(--surface);">
    <h1 style="font-size:17px;">本日の予約</h1>
    <p style="margin:2px 0 0;font-size:12px;color:var(--ink-faint);">田中 仁さん（第1マッサージ室）</p>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:18px;">

    <div style="display:flex;gap:6px;">
      <div class="daytab" style="background:var(--role-therapist);color:#fff;font-weight:500;">今日 9/9</div>
      <div class="daytab" style="background:var(--surface-2);color:var(--ink-faint);">明日 9/10</div>
      <div class="daytab" style="background:var(--surface-2);color:var(--ink-faint);">9/11</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">

      <div class="booking-card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="mono" style="font-size:16px;font-weight:700;">12:00</span>
          <span style="font-size:11px;padding:3px 9px;border-radius:20px;background:var(--role-therapist-soft);color:var(--role-therapist);">45分</span>
        </div>
        <div>
          <div style="font-size:14px;font-weight:500;">佐々木 美咲 <span style="font-size:11px;font-weight:400;color:var(--ink-faint);">・ 開発部</span></div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;">肩と首の張りが強い。デスクワーク中心なので重点的に。</div>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="link-btn" style="background:var(--surface-2);color:var(--ink-soft);">前回のカルテを見る</div>
        </div>
      </div>

      <div class="booking-card" style="border-color:var(--role-therapist);">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="mono" style="font-size:16px;font-weight:700;color:var(--role-therapist);">19:00</span>
          <span style="font-size:11px;padding:3px 9px;border-radius:20px;background:var(--role-therapist-soft);color:var(--role-therapist);">45分</span>
        </div>
        <div>
          <div style="font-size:14px;font-weight:500;">高橋 直人 <span style="font-size:11px;font-weight:400;color:var(--ink-faint);">・ 営業部</span></div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;">腰が重い。長時間の立ち仕事が続いている。</div>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="link-btn" style="background:var(--role-therapist);color:#fff;">施術後カルテを記入する</div>
        </div>
      </div>

    </div>

    <!-- Notification settings (shared component) -->
    <dc-import name="NotificationCard" role="therapist" hint-size="100%,150px"></dc-import>

  </div>
</div>

</body>
</html>
