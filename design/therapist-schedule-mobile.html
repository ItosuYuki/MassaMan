<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マッサージ師 勤務時間登録画面（スマホ版）</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#EEF3F9; --surface:#FFFFFF; --surface-2:#E2E9F2; --border:#CBD7E3;
    --ink:#1B2733; --ink-soft:#4C5C6E; --ink-faint:#7C8CA0;
    --accent:#2B5C99; --accent-strong:#1D4370; --accent-soft:#DCE7F5;
    --role-therapist:#2F5E86; --role-therapist-soft:#DDE7F0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Shippori Mincho",serif;margin:0;}
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}
  .daytab{padding:8px 14px;border-radius:20px;font-size:13px;flex-shrink:0;}
  .hourrow{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;}
  .switch{width:38px;height:22px;border-radius:11px;position:relative;flex-shrink:0;}
  .switch.on{background:var(--role-therapist);}
  .switch.off{background:var(--surface-2);border:1px solid var(--border);}
  .knob{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on .knob{left:18px;}
  .switch.off .knob{left:2px;}

</style>
</head>
<body>

<div style="position:relative;width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);background:var(--surface);">
    <h1 style="font-size:17px;">勤務時間登録</h1>
    <p style="margin:2px 0 0;font-size:12px;color:var(--ink-faint);">木村 健さんの施術可能時間</p>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:18px 20px 100px;display:flex;flex-direction:column;gap:16px;">

    <!-- Copy from template -->
    <button style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:12px;border:1.5px dashed var(--role-therapist);background:var(--role-therapist-soft);color:var(--role-therapist);font-size:13px;font-weight:500;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5E86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 011-1h11"/></svg>
      先週の勤務パターンをコピーする
    </button>

    <!-- Day tabs -->
    <div style="display:flex;gap:6px;overflow-x:auto;">
      <div class="daytab" style="background:var(--surface-2);color:var(--ink-faint);">月</div>
      <div class="daytab" style="background:var(--surface-2);color:var(--ink-faint);">火</div>
      <div class="daytab" style="background:var(--role-therapist);color:#fff;font-weight:500;">水</div>
      <div class="daytab" style="background:var(--surface-2);color:var(--ink-faint);">木</div>
      <div class="daytab" style="background:var(--surface-2);color:var(--ink-faint);">金</div>
    </div>

    <!-- Hour toggles -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;">
      <div class="hourrow"><span class="mono" style="font-size:13px;">9:00 - 10:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">10:00 - 11:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">11:00 - 12:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow" style="background:var(--surface-2);border-radius:10px;">
        <div><span class="mono" style="font-size:13px;color:var(--ink-faint);">12:00 - 13:00</span><span style="font-size:10px;color:var(--ink-faint);margin-left:8px;">休憩</span></div>
        <div class="switch off"><div class="knob"></div></div>
      </div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">13:00 - 14:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">14:00 - 15:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">15:00 - 16:00</span><div class="switch off"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">16:00 - 17:00</span><div class="switch off"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">17:00 - 18:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">18:00 - 19:00</span><div class="switch on"><div class="knob"></div></div></div>
      <div class="hourrow"><span class="mono" style="font-size:13px;">19:00 - 20:00</span><div class="switch on"><div class="knob"></div></div></div>
    </div>

    <p style="margin:0;font-size:11px;color:var(--ink-faint);line-height:1.7;">
      1枠は60分（施術は最大45分・片付け15分を含みます）。予約受付期間は管理者が設定した範囲まで表示されます。
    </p>
  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:16px 20px 24px;background:linear-gradient(180deg, rgba(242,245,239,0) 0%, var(--bg) 40%);">
    <button style="width:100%;height:52px;border:none;border-radius:14px;background:var(--role-therapist);color:#fff;font-size:15px;font-weight:500;cursor:pointer;">この内容で保存する</button>
  </div>
</div>

</body>
</html>
