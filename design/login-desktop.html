<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン画面（PC版）</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#F2F5EF; --surface:#FCFDFB; --surface-2:#E7ECE1; --border:#D3DBCB;
    --ink:#212821; --ink-soft:#5B6459; --ink-faint:#8A9284;
    --accent:#2E5D5A; --accent-strong:#1E4643; --accent-soft:#DCEAE6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Shippori Mincho",serif;margin:0;}
  a{color:var(--accent-strong);}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:12px;font-size:14px;font-weight:500;border:none;cursor:pointer;}
  .btn-primary{background:#fff;color:var(--accent-strong);}
  .btn-ghost{background:transparent;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.35);}

</style>
</head>
<body>

<div style="width:1280px;height:800px;display:flex;">

  <!-- Brand panel -->
  <div style="width:520px;flex-shrink:0;background:var(--accent-strong);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:56px;position:relative;overflow:hidden;">
    <svg width="620" height="620" viewBox="0 0 24 24" style="position:absolute;right:-220px;bottom:-220px;opacity:.08;" fill="none" stroke="#fff" stroke-width="0.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3 2-5 4-5h8c2 0 4 2 4 5"/></svg>

    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3 2-5 4-5h8c2 0 4 2 4 5"/></svg>
      </div>
      <span style="font-size:15px;letter-spacing:.02em;">ほぐし予約</span>
    </div>

    <div style="position:relative;">
      <h1 style="font-size:34px;line-height:1.5;color:#fff;text-wrap:balance;">社内マッサージ室を、<br>もっと気軽に。</h1>
      <p style="margin:18px 0 0;font-size:14px;line-height:1.9;color:rgba(255,255,255,.75);max-width:380px;">
        空き状況の確認から予約・キャンセルまで、スマホからもパソコンからも同じアカウントで利用できます。
      </p>
    </div>

    <p style="position:relative;margin:0;font-size:12px;color:rgba(255,255,255,.5);">Ca-adv Tech Jam 社内システム</p>
  </div>

  <!-- Form panel -->
  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;background:var(--bg);">
    <div style="width:340px;display:flex;flex-direction:column;gap:24px;">
      <div>
        <h2 style="font-size:20px;">ログイン</h2>
        <p style="margin:6px 0 0;font-size:13px;color:var(--ink-faint);">社内アカウントでログインしてください</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <button class="btn" style="background:var(--accent);color:#fff;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/></svg>
          社内アカウントでログイン
        </button>
        <div style="display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12px;">
          <div style="flex-grow:1;height:1px;background:var(--border);"></div>または<div style="flex-grow:1;height:1px;background:var(--border);"></div>
        </div>

        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:12px;color:var(--ink-soft);">社員番号</span>
          <div style="height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);"></div>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:12px;color:var(--ink-soft);">パスワード</span>
          <div style="height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);"></div>
        </label>
        <button class="btn" style="background:var(--surface);color:var(--ink-soft);border:1px solid var(--border);margin-top:4px;">社員番号でログイン</button>
      </div>

      <p style="margin:0;font-size:12px;color:var(--ink-faint);line-height:1.7;">
        ログイン後、利用者 / マッサージ師 / 管理者のホーム画面に自動で振り分けられます。
      </p>
    </div>
  </div>
</div>

</body>
</html>
