<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン画面（スマホ版・共通）</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#EEF3F9; --surface:#FFFFFF; --surface-2:#E2E9F2; --border:#CBD7E3;
    --ink:#1B2733; --ink-soft:#4C5C6E; --ink-faint:#7C8CA0;
    --accent:#2B5C99; --accent-strong:#1D4370; --accent-soft:#DCE7F5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Shippori Mincho",serif;margin:0;}
  a{color:var(--accent-strong);}
  ::selection{background:var(--accent-soft);}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:12px;font-size:15px;font-weight:500;border:none;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-strong);}

</style>
</head>
<body>

<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;">

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 32px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="width:64px;height:64px;border-radius:20px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1D4370" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="18" rx="7" ry="2.6" />
          <ellipse cx="12" cy="11.5" rx="5" ry="2" />
          <ellipse cx="12" cy="6" rx="3" ry="1.6" />
        </svg>
      </div>
      <div style="text-align:center;">
        <h1 style="font-size:22px;color:var(--ink);">マッサマン</h1>
        <p style="margin:6px 0 0;font-size:13px;color:var(--ink-faint);">社内マッサージ室 予約システム</p>
      </div>
    </div>

    <div style="width:100%;display:flex;flex-direction:column;gap:12px;">
      <button class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/></svg>
        社内アカウントでログイン
      </button>
      <div style="display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12px;">
        <div style="flex-grow:1;height:1px;background:var(--border);"></div>
        または
        <div style="flex-grow:1;height:1px;background:var(--border);"></div>
      </div>
      <button class="btn btn-ghost">社員番号でログイン</button>
    </div>

    <p style="font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.7;margin:0;">
      ログイン後、利用者 / マッサージ師 / 管理者のいずれかの<br>ホーム画面に自動で振り分けられます。
    </p>
  </div>

  <div style="padding:20px 0 28px;text-align:center;font-size:11px;color:var(--ink-faint);">
    Ca-adv Tech Jam 社内システム
  </div>
</div>

</body>
</html>
