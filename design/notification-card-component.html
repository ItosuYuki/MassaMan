<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共有コンポーネント：通知設定カード</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --surface:#FFFFFF; --surface-2:#E2E9F2; --border:#CBD7E3;
    --ink:#1B2733; --ink-soft:#4C5C6E; --ink-faint:#7C8CA0;
    --accent:#2B5C99; --accent-strong:#1D4370; --accent-soft:#DCE7F5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans JP",sans-serif;color:var(--ink);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;}
  .row + .row{border-top:1px solid var(--border);}
  .switch{width:38px;height:22px;border-radius:11px;position:relative;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch.off{background:var(--surface-2);border:1px solid var(--border);}
  .knob{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on .knob{left:18px;}
  .switch.off .knob{left:2px;background:#fff;}

</style>
</head>
<body>

<div style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;">
    <h3 style="font-size:14px;color:var(--ink);">予約リマインド通知</h3>
  </div>

  <div class="row">
    <div>
      <div style="font-size:13px;color:var(--ink);">通知</div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">アプリ内通知 + メール</div>
    </div>
    <div class="switch on"><div class="knob"></div></div>
  </div>

  <div class="row">
    <div>
      <div style="font-size:13px;color:var(--ink);">通知タイミング</div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">予約時刻の何分前に届けるか</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;">
      <span class="mono" style="font-size:13px;color:var(--accent-strong);font-weight:700;">30</span>
      <span style="font-size:12px;color:var(--ink-faint);">分前</span>
    </div>
  </div>
</div>

</body>
</html>
